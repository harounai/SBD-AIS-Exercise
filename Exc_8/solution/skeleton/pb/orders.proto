syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";

option go_package = "exc8/pb";

package models;

// Messages

// todo implement messages
//
// message MyMessage {
//  ....
// }
message Drink {       // drink definition
  int32 id = 1;
  string name = 2;
  int32 price = 3;
  string description = 4;
}

message DrinkList {     // list of drinks
  repeated Drink drinks = 1;
}

message OrderItem {     // single order item
  int32 drink_id = 1;
  int32 quantity = 2;
}

message OrderRequest {        // request to orders
  repeated OrderItem items = 1;
}

message OrderTotals {         // totals
  repeated OrderItem totals = 1;
}


// Generate go files with:
// Execute `generate_pb.sh`

// Define the service
service OrderService {
  // todo define rpc functions
  rpc OrderDrink (OrderRequest) returns (google.protobuf.Empty);
  rpc GetDrinks (google.protobuf.Empty) returns (DrinkList);
  rpc GetOrders (google.protobuf.Empty) returns (OrderTotals);
}